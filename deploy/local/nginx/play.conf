# Rehearsal only: a page that joins the network from a browser (a copy of
# a web build's dist, PLAY_DIST) over https at play.localtest, with the
# isolation headers a WebAssembly page with threads needs.
server {
    listen 443 ssl;
    server_name play.localtest;
    include snippets/asterism-ssl-console.conf;
    root /srv/play;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cache-Control no-store always;
    types {
        application/wasm wasm;
        text/javascript js mjs;
        text/html html;
        text/css css;
        application/octet-stream data;
        image/png png;
        application/json json;
    }
}
