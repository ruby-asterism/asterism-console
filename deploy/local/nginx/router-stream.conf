# Rehearsal only: the router's mutual-TLS port at the server's name. On a
# server docker publishes zenohd's 7448 on the server's address; here the
# nginx container stands for that address (router.localtest), so it hands
# 7448 on to zenohd untouched (TCP, TLS end to end).
stream {
    server {
        listen 7448;
        proxy_pass zenohd:7448;
    }
}
