# Rehearsal only: the stock nginx.conf of the image, plus the stream block
# (router-stream.conf) that stands for docker's published 7448.
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;
events {
    worker_connections  1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    include /etc/nginx/conf.d/*.conf;
}
include /etc/nginx/router-stream.conf;
