# Asterism on a server: the internet router (zenohd) and the console
# (Rails), its bridge, its signer and the browsers' door. Steps:
# docs/install.md. A web server in front (nginx, Caddy, ...) ends TLS for
# the console's name and for the browsers' wss://, and forwards to the
# loopback ports below. Only the router's mutual-TLS port is reached
# directly.
#
#   service   listens                        published on the host
#   zenohd    tls/7448 (mTLS, own CA)        ${ROUTER_TLS_BIND}:${ROUTER_TLS_PORT}
#             ws/7449 (browsers)             none: the door only
#   door      7451 (bin/ws_door)             127.0.0.1:${ROUTER_WS_PORT} (the web server, with a pass check);
#             relays to zenohd ws/7449 and closes a connection after WS_DOOR_MAX_SECONDS
#             7452 (the rooms, G2)           127.0.0.1:${ROOM_DOOR_PORT} (the web server's /room): checks a
#             room's key, then mutual TLS to zenohd tls/7448 with the room slot's certificate
#             7453 (its connection counts)   none: the console asks on the "router" network
#   console   3000 (Puma, production)        127.0.0.1:${CONSOLE_PORT} (the web server)
#   bridge    -- (a client of zenohd)        none
#   signer    7450 (the CA's key)            none: on the "signer" network only, which only the console joins
#   backup    -- (no network)                none: copies the databases into the "backups" volume once a day
#
# The console's image is the published one, by version:
# ${CONSOLE_IMAGE}:${CONSOLE_VERSION} (ghcr.io/ruby-asterism/asterism-console;
# docker compose pull). To build it here instead, add
# docker-compose.build.yml (docs/install.md, "Building the image yourself").
#
# Settings and secrets: .env next to this file (env.example lists them;
# never commit it). Updating: ./update.sh <version> (docs/install.md,
# "Updating"); it takes a backup first.
name: asterism

x-console: &console
  image: ${CONSOLE_IMAGE:-ghcr.io/ruby-asterism/asterism-console}:${CONSOLE_VERSION:-0.2.1}
  init: true
  restart: unless-stopped
  env_file: ${ASTERISM_ENV_FILE:-.env}
  stop_grace_period: 5s

services:
  zenohd:
    image: eclipse/zenoh:1.10.1
    init: true
    restart: unless-stopped
    stop_grace_period: 3s
    entrypoint: ["/bin/sh", "/run.sh"]
    environment:
      RUST_LOG: ${ZENOHD_LOG:-info}
    volumes:
      - ./zenohd/run.sh:/run.sh:ro
      - certs:/certs:ro
      - generated:/generated:ro
    ports:
      - "${ROUTER_TLS_BIND:-0.0.0.0}:${ROUTER_TLS_PORT:-7448}:7448"
    networks: [router]

  # The browsers' door (G1): nginx -> here -> zenohd's ws/ listener. Gives
  # each WebSocket a lifetime (nginx's timeouts only close idle ones) and
  # logs the path nginx forwarded (it must carry no pass).
  # The rooms' door (G2, docs/rooms.md) is the same process: it reads the
  # rooms' file and the slots' certificates the console writes (the "rooms"
  # volume, read-only here). Two threads per connection: a small thread
  # stack keeps a connection near 0.5 MB.
  door:
    <<: *console
    env_file: !reset []
    command: ["ruby", "bin/ws_door"]
    environment:
      WS_DOOR_LISTEN: 0.0.0.0:7451
      WS_DOOR_UPSTREAM: zenohd:7449
      WS_DOOR_MAX_SECONDS: ${WS_DOOR_MAX_SECONDS:-14400}
      WS_DOOR_ROOM_LISTEN: 0.0.0.0:7452
      WS_DOOR_ROOM_UPSTREAM: zenohd:7448
      WS_DOOR_ROOMS_FILE: /rooms/rooms.json
      WS_DOOR_ROOM_CERTS: /rooms/certs
      WS_DOOR_ROOM_TOTAL: ${WS_DOOR_ROOM_TOTAL:-48}
      WS_DOOR_ROOM_PER_ROOM: ${WS_DOOR_ROOM_PER_ROOM:-16}
      WS_DOOR_STATUS_LISTEN: 0.0.0.0:7453
      RUBY_THREAD_VM_STACK_SIZE: "131072"
      MALLOC_ARENA_MAX: "2"
    volumes:
      - rooms:/rooms:ro
    ports:
      - "127.0.0.1:${ROUTER_WS_PORT:-7449}:7451"
      - "127.0.0.1:${ROOM_DOOR_PORT:-7452}:7452"
    networks: [router]
    depends_on: [zenohd]

  console:
    <<: *console
    # The databases are made (or migrated) on every start. The server refuses
    # to start until a user exists (bin/asterism setup makes the first admin).
    command: ["sh", "-c", "bin/rails db:prepare && exec bin/rails server -b 0.0.0.0 -p 3000"]
    environment:
      CONSOLE_BIND: 0.0.0.0
      ASTERISM_SIGNER_URL: http://signer:7450
      ASTERISM_RELAY_GENERATED_DIR: /generated
      ASTERISM_RELAY_RESTART: /app/bin/relay_restart_request
      ASTERISM_RELAY_COMPOSE_DIR: /app
      ASTERISM_RELAY_CLOUD_NAME: ${ROUTER_NAME:-zenohd-cloud}
      ASTERISM_RELAY_CERTS_DIR: /certs
      ASTERISM_RELAY_BROWSERS: ws/[::]:7449
      ASTERISM_BACKUP_DIR: /backups
      ASTERISM_ROOMS_DIR: /rooms
      ASTERISM_DOOR_STATUS_URL: http://door:7453/status
    volumes:
      - storage:/app/storage
      - generated:/generated
      - certs:/certs
      - backups:/backups
      - rooms:/rooms
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-3000}:3000"
    networks: [router, signer]
    depends_on: [signer]

  bridge:
    <<: *console
    command: ["bin/bridge"]
    environment:
      ASTERISM_ROUTER: tls/zenohd:7448
      ASTERISM_TLS_CA: /certs/ca.pem
      ASTERISM_TLS_CERT: /certs/console.pem
      ASTERISM_TLS_KEY: /certs/console.key
      ASTERISM_CONSOLE_NODE: console
    volumes:
      - storage:/app/storage
      - certs:/certs:ro
    networks: [router]
    depends_on: [zenohd, console]

  # The daily backup (0.1.3): a consistent copy of the console's databases
  # into the "backups" volume at ASTERISM_BACKUP_HOUR (UTC unless TZ is set
  # in .env), keeping the newest ASTERISM_BACKUP_KEEP. A failure shows on
  # the admin pages (Relay, Users). bin/asterism backups lists them.
  backup:
    <<: *console
    command: ["bin/asterism", "backup-daily"]
    environment:
      ASTERISM_BACKUP_DIR: /backups
    volumes:
      - storage:/app/storage
      - backups:/backups
    network_mode: none

  signer:
    <<: *console
    user: "1001:1001"
    env_file: !reset []
    environment:
      SIGNER_TOKEN: ${ASTERISM_SIGNER_TOKEN:?set ASTERISM_SIGNER_TOKEN in .env}
    command: ["ruby", "bin/signer", "serve", "--ca-dir", "/ca/ca", "--listen", "0.0.0.0:7450"]
    volumes:
      - signer_ca:/ca
    networks: [signer]

volumes:
  storage: {}      # the console's databases and recordings
  generated: {}    # the router's configuration, written by the console
  certs: {}        # the CA certificate and this server's own router / bridge keys
  signer_ca: {}    # the CA's private key: the signer's only (back it up off the server, docs/install.md)
  backups: {}      # the console's database backups (bin/asterism backup; copy them off the server too)
  rooms: {}        # the rooms (G2): the door's file and the room slots' certificates and keys

networks:
  router: {}
  signer:
    internal: true   # no way out, and nothing in but the console
