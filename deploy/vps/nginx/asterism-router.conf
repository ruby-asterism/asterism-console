# The browsers' door to the router: wss://router.example.org:7443/ (the
# browser build's locator is ws/router.example.org:7443; a page served over
# https picks wss:// itself). nginx ends TLS and hands the WebSocket to
# zenohd's ws/ listener on the loopback, but only after the console says
# the pass is live: auth_request asks /passes/check once per connection.
# The pass is the "pass" query parameter of the WebSocket URL, next to
# "page", the page's own key: the first page that uses a pass takes it,
# and only that page may connect again with it (after the router restarts),
# until the pass closes a few hours after its first use. nginx drops the
# query before proxying, so zenohd never sees the pass. The upstream is the
# door relay (bin/ws_door, the "door" service), which closes a connection
# when the pass closes (the console's answer says when: X-Asterism-Until,
# handed on below) and after WS_DOOR_MAX_SECONDS (4 h) at most: nginx's
# timeouts only close idle connections, and a Zenoh session is never idle.
# After that a browser needs a fresh pass.
server {
    # IPv4 only, as the router's port in docker-compose.yml: add
    # "listen [::]:7443 ssl;" when your firewall limits IPv6 the same way.
    listen 7443 ssl;
    server_name router.example.org;
    include snippets/asterism-ssl-router.conf;

    # No query strings in the log (the pass is one).
    access_log /var/log/nginx/asterism-router.access.log asterism_noquery;
    error_log  /var/log/nginx/asterism-router.error.log;

    include snippets/asterism-door-allow.conf;

    location = / {
        if ($http_upgrade !~* "^websocket$") {
            return 404;
        }
        limit_req zone=asterism_wss burst=10 nodelay;
        limit_req_status 429;
        limit_conn asterism_wss_conn 8;
        auth_request /_asterism_pass;
        auth_request_set $asterism_until $upstream_http_x_asterism_until;

        # Drop the query (the pass) from what goes upstream; the check above
        # still reads it from $request_uri, which a rewrite does not change.
        rewrite ^ /? break;
        proxy_pass http://asterism_router_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $asterism_connection;
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Asterism-Until $asterism_until;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The subrequest: the console answers 204 (open) or 401 (refused). It
    # gets the original URI (with the pass) in a header, not in its own URL,
    # so the console's request log has no pass either.
    location = /_asterism_pass {
        internal;
        proxy_pass http://asterism_console/passes/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI  $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host            $host;
    }

    location / {
        return 404;
    }
}
