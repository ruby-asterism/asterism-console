# Who may use the console's admin pages (/admin/...: the relay registry,
# certificates, apply, call permissions, users, invitations, every pass).
# This stays when the rest of the console is opened to everyone. One
# "allow" per address or network of the admins, then deny the rest.
allow 192.0.2.10;
# allow 2001:db8::/64;
deny all;
