# Who may open the browsers' wss:// door. A pass is needed anyway; this is
# a second lock by address (e.g. the known addresses of the people who use
# it). To open it to anyone with a pass, replace the lines below with
# "allow all;". (Named asterism-players-allow.conf before G1.5:
# docs/install.md, "Updating from an earlier deployment".)
allow 192.0.2.20;
deny all;
