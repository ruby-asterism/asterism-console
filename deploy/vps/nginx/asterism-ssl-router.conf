# TLS for the router's wss:// port: the server's existing certificate for
# its main name (router.example.org; already kept by Certbot, as for the
# other apps on their own TLS ports). Adjust paths.
ssl_certificate     /etc/letsencrypt/live/router.example.org/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/router.example.org/privkey.pem;
include /etc/letsencrypt/options-ssl-nginx.conf;
