# TLS for the router's wss:// port: a certificate for the router's name
# (router.example.org; the console's own certificate when both are one
# name). Certbot keeps it under /etc/letsencrypt/live/<name>/. Adjust paths.
ssl_certificate     /etc/letsencrypt/live/router.example.org/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/router.example.org/privkey.pem;
include /etc/letsencrypt/options-ssl-nginx.conf;
