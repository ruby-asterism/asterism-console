# The console: https://asterism.example.org/ (sites-available/, linked into
# sites-enabled/). Everything but the admin pages is open to any address
# (the console asks everyone to sign in); /admin/ is limited by address.
server {
    listen 80;
    listen [::]:80;
    server_name asterism.example.org;
    # Certbot's HTTP-01 challenge (webroot) is answered here; the rest goes to https.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # No HTTP/2 here. "http2 on;" needs nginx 1.25.1 (Ubuntu 22.04 ships
    # 1.18), and before that version "listen 443 ssl http2" turns HTTP/2 on
    # for the whole 443 socket, i.e. for every other site on the server too.
    # The console does not need it (Action Cable is a WebSocket over HTTP/1.1).
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name asterism.example.org;
    include snippets/asterism-ssl-console.conf;

    access_log /var/log/nginx/asterism-console.access.log asterism_noquery;
    error_log  /var/log/nginx/asterism-console.error.log;

    # Recordings upload up to 256 MB.
    client_max_body_size 300m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # The pass check is the router door's question (asterism-router.conf), never asked from outside.
    location = /passes/check {
        return 404;
    }

    # The admin pages: limited by address, whatever the rest allows.
    location ^~ /admin {
        include snippets/asterism-admin-allow.conf;
        include snippets/asterism-proxy.conf;
        proxy_pass http://asterism_console;
    }

    # Signing in: a few tries a minute per address.
    location = /session {
        limit_req zone=asterism_signin burst=5 nodelay;
        limit_req_status 429;
        include snippets/asterism-proxy.conf;
        proxy_pass http://asterism_console;
    }
    location ^~ /invitations/ {
        limit_req zone=asterism_signin burst=5 nodelay;
        limit_req_status 429;
        include snippets/asterism-proxy.conf;
        proxy_pass http://asterism_console;
    }

    # An invite link's page (0.3.5, docs/rooms.md "Invite links"): it makes
    # rooms without signing in, so it is open to the addresses the rooms'
    # door is open to (asterism-door-allow.conf, as /room on the router's
    # port): whoever cannot join a room cannot make one either. To open it
    # wider or narrower than /room, give it an allow list of its own. The
    # link's secret is in its fragment, never in the request line.
    location = /invite {
        include snippets/asterism-door-allow.conf;
        limit_req zone=asterism_signin burst=10 nodelay;
        limit_req_status 429;
        include snippets/asterism-proxy.conf;
        proxy_pass http://asterism_console;
    }
    location ^~ /invite/ {
        include snippets/asterism-door-allow.conf;
        limit_req zone=asterism_signin burst=10 nodelay;
        limit_req_status 429;
        include snippets/asterism-proxy.conf;
        proxy_pass http://asterism_console;
    }

    # Action Cable (the page's live updates) and everything else.
    location / {
        include snippets/asterism-proxy.conf;
        proxy_pass http://asterism_console;
    }
}
