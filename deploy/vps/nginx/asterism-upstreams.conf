# http { } context (conf.d/): the two services, on the loopback ports of
# docker-compose.yml (.env: CONSOLE_PORT, ROUTER_WS_PORT). Change the ports
# here when .env changes them.
upstream asterism_console {
    server 127.0.0.1:3000;
    keepalive 8;
}
upstream asterism_router_ws {
    server 127.0.0.1:7449;
}
