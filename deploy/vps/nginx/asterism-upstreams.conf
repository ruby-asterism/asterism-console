# http { } context (conf.d/): the two services, on the loopback ports of
# docker-compose.yml (.env: CONSOLE_PORT, ROUTER_WS_PORT, ROOM_DOOR_PORT).
# Change the ports here when .env changes them.
upstream asterism_console {
    server 127.0.0.1:3000;
    keepalive 8;
}
# The browsers' WebSockets go to the door relay (bin/ws_door), which hands
# them to zenohd's ws/ listener and caps their lifetime.
upstream asterism_router_ws {
    server 127.0.0.1:7449;
}
# The rooms' door (G2, bin/ws_door's room listener): it checks a room's key
# and connects to zenohd's mutual-TLS port with the room slot's certificate.
upstream asterism_room_door {
    server 127.0.0.1:7452;
}
