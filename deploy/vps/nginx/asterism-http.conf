# http { } context: put in /etc/nginx/conf.d/ (included inside http by the
# stock configuration). Every name starts with asterism_ so nothing here
# meets the server's other sites.

map $http_upgrade $asterism_connection {
    default upgrade;
    ''      close;
}

# Sign-in tries and WebSocket opens per address (Rails has its own limits
# behind these).
limit_req_zone  $binary_remote_addr zone=asterism_signin:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=asterism_wss:10m    rate=30r/m;
limit_conn_zone $binary_remote_addr zone=asterism_wss_conn:10m;
# Rooms (G2): tries to join a room per address. Many people at one event
# may come from one address, so this is wider than the passes' (the door
# also limits keys that do not check, and every room's connections).
limit_req_zone  $binary_remote_addr zone=asterism_room:10m   rate=60r/m;
limit_conn_zone $binary_remote_addr zone=asterism_room_conn:10m;

# A log line without the query string: the browser's pass travels in the
# WebSocket URL (?pass=...), and so does a room's key (/room?t=...), so
# neither may reach the access log.
log_format asterism_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent "$http_user_agent" rt=$request_time';
