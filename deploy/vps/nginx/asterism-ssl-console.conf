# TLS for the console's name (Certbot, asterism.example.org): what
# "certbot certonly" leaves. Adjust paths.
ssl_certificate     /etc/letsencrypt/live/asterism.example.org/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/asterism.example.org/privkey.pem;
include /etc/letsencrypt/options-ssl-nginx.conf;
ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
