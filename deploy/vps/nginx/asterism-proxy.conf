# Proxy headers for the console (snippets/). X-Forwarded-For is set, not
# appended: the console takes the client's address from it (sign-in limits,
# CONSOLE_ADMIN_NETS), so a client must not be able to put its own there.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $asterism_connection;
proxy_read_timeout 1h;
